Name: aiagent.rpc
ListenOn: 0.0.0.0:10012
Mode: dev
Timeout: 0

Consul:
  Host: localhost:8500
  Key: aiagent.rpc
  Meta:
    Protocol: grpc

Telemetry:
  Name: aiagent.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: jaeger
  Sampler: 1.0

DevServer:
  Enabled: true
  Host: localhost
  Port: 11009
  EnablePprof: false

Log:
  Stat: false
  ServiceName: "aiagent-rpc"
  Mode: 'file'
  Encoding: "json"
  Path: "./logs/aiagent-rpc"

MysqlConfig:
  datasource: "root:root@tcp(localhost:33061)/mall?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"

RedisConf:
  Host: localhost:6379
  Type: node
  Pass: leventsg
  Tls: false

Cache:
  - Host: localhost:6379
    Type: node
    Pass: leventsg

Eino:
  Provider: ${AI_MODEL_PROVIDER}
  APIKey: ${AI_MODEL_API_KEY}
  BaseURL: ${AI_MODEL_BASE_URL}
  Model: ${AI_MODEL_NAME}
  Timeout: 300
  MaxTokens: 2048
  Temperature: 0.2

SummaryModel:
  Provider: ${AI_SUMMARY_MODEL_PROVIDER}
  APIKey: ${AI_SUMMARY_MODEL_API_KEY}
  BaseURL: ${AI_SUMMARY_MODEL_BASE_URL}
  Model: ${AI_SUMMARY_MODEL_NAME}
  Timeout: 300
  MaxTokens: 1024
  Temperature: 0

ProfileModel:
  Provider: ${AI_PROFILE_MODEL_PROVIDER}
  APIKey: ${AI_PROFILE_MODEL_API_KEY}
  BaseURL: ${AI_PROFILE_MODEL_BASE_URL}
  Model: ${AI_PROFILE_MODEL_NAME}
  Timeout: 300
  MaxTokens: 1024
  Temperature: 0

KafkaMQ:
  Brokers:
    - "localhost:9092"
  Username: ""
  Password: ""
  Topics:
    AiMemoryUpdates:
      Topic: "ai-memory-updates"
      Group: "ai-memory-updates-profile-consumer"
      Offset: last
      Conns: 1
      Consumers: 1
      Processors: 2
      MinBytes: 10240
      MaxBytes: 10485760
      ForceCommit: true

ToolTimeout:
  QuerySeconds: 3
  WriteSeconds: 5

OrderAPI:
  BaseURL: "http://localhost:8004"
  Timeout: 5000

RAG:
  Enabled: true
  BaseURL: "http://localhost:5173"
  APIKey: ${RAGENT_API_KEY}
  RetrievePath: "/api/ragent/open-api/v1/retrieve"
  EmbeddingPath: "/api/ragent/open-api/v1/embedding"
  Timeout: 3000
  TopK: 5
  ConfidenceThreshold: 0.6
  VectorSimilarityThreshold: 0.95
  CacheTTLSeconds: 86400
  EmbeddingDimension: 1536
  PreviewBaseURL: "http://localhost:5173"
  SourcePreviewChars: 200
  RecentMessages: 6
  EmbeddingModel: "qwen-emb-8b"

Confirmation:
  ExpireSeconds: 300
  LockExpireSeconds: 5

ProductRpc:
  Target: consul://localhost:8500/products.rpc?wait=14s
  NonBlock: true
  Timeout: 3000

InventoryRpc:
  Target: consul://localhost:8500/inventory.rpc?wait=14s
  NonBlock: true
  Timeout: 3000

OrderRpc:
  Target: consul://localhost:8500/order.rpc?wait=14s
  NonBlock: true
  Timeout: 5000

CheckoutRpc:
  Target: consul://localhost:8500/checkout.rpc?wait=14s
  NonBlock: true
  Timeout: 5000

CartRpc:
  Target: consul://localhost:8500/carts.rpc?wait=14s
  NonBlock: true
  Timeout: 5000

CouponRpc:
  Target: consul://localhost:8500/coupons.rpc?wait=14s
  NonBlock: true
  Timeout: 5000

AuditRpc:
  Target: consul://localhost:8500/audit.rpc?wait=14s
  NonBlock: true
  Timeout: 3000
