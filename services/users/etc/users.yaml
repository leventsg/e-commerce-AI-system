Name: users.rpc
ListenOn: 0.0.0.0:10001
Mode: dev

# 服务发现
Consul:
  Host: localhost:8500 # consul endpoint
  Key: 
    users.rpc
  Meta:
    Protocol: grpc

# 链路追踪
Telemetry:
  Name: users.rpc
  Endpoint: http://localhost:14268/api/traces
  Batcher: jaeger
  Sampler: 1.0

# 指标监控配置
DevServer:
  Enabled: true
  Host: localhost
  Port: 11001 
  EnablePprof: false

AuditRpc:
  Target: consul://localhost:8500/audit.rpc?wait=14s
  NonBlock: true 

Log:
  Stat: false
  ServiceName: "users-rpc"
  Mode: 'file'
  Encoding: "json"
  Path: "../../devlog/gozero/users-rpc"

MysqlConfig:
  datasource: "root:root@tcp(localhost:33061)/mall?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"
  Conntimeout: 5


Cache:
  - Host: 127.0.0.1:6380 #缓存地址
    Pass: leventsg
    Type: node  

Prometheus:
  Host: 0.0.0.0   # 监控暴露的 IP
  Port: 9100       # 监控暴露的端口
  Path: /metrics   # 默认路径（可自定义）

RedisConf:
  Host: 127.0.0.1:6380
  Pass: leventsg
  Tls: false
EmailCode:
  TTLSeconds: 300
  ResendCooldown: 60
  Enabled: true
  SMTPHost: "smtp.qq.com"
  SMTPPort: 465
  SMTPUsername: "1960155751@qq.com"
  SMTPPassword: "egibiwdhbulqcgdf"
  SMTPFrom: "1960155751@qq.com"
  SMTPDisplayName: "go-mall"
  SMTPTLS: true
GorseConfig:
