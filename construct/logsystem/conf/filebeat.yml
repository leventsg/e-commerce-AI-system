filebeat.inputs:
  - type: filestream
    id: go-mall-devlog
    enabled: true
    paths:
      - /usr/share/filebeat/devlog/**/*.log
    fields:
      project: go-mall
      env: dev
      log_source: devlog
    fields_under_root: true

processors:
  - add_host_metadata: ~

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"

setup.kibana:
  host: "http://kibana:5601"

logging.to_files: false
